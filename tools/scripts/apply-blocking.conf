# ============================================================================
# apply-blocking.conf — профиль блокировок
#
# Единственный управляющий файл для пары apply-blocking.sh / apply-blocking.ps1.
# Что применяется, решается ЗДЕСЬ, а не правкой скриптов: снять комментарий —
# включить, поставить — выключить. Обе половины пары читают этот файл, поэтому
# профиль станции не разъезжается между Linux и Windows.
#
# Порядок применения фиксирован (research/06-services-blocklist.md, «Порядок
# применения»): P0 -> P1a -> P1b -> P2 -> T -> P3 -> P5. Порядок задан
# приоритизацией: инициаторы отключаются раньше исполнителей, иначе
# исполнитель поднимет своего инициатора обратно.
#
# Формат:  ключ = 1 (включено) | 0 (выключено).
# Неизвестный ключ — ошибка, а не молчаливое игнорирование: опечатка в
# названии не должна превращаться в «профиль не сработал».
# ============================================================================

# --- Группы ----------------------------------------------------------------

# P0. Критические инициаторы. Включают или ВОССТАНАВЛИВАЮТ остальное, поэтому
# идут первыми: WaaSMedicSvc, UsoSvc, wuauserv (Manual, не Disabled), DoSvc,
# InstallService, provisioned appx, SilentInstalledAppsEnabled, Active Setup.
P0 = 1

# P1a. Задачи планировщика — инициаторы телеметрии. Отключаются РАНЬШЕ
# служб-исполнителей.
P1a = 1

# P1b. Службы-инициаторы: DiagTrack, dmwappushservice, InventorySvc, DPS,
# Wdi*, WerSvc, PcaSvc, CDP*, wisvc, SysMain, WSearch, MapsBroker, lfsvc,
# TrkWks.
P1b = 1

# P2. Исполнители: IFEO-заглушки, службы Xbox/игр, RemoteRegistry, RetailDemo
# и прочее. Применяются после своих инициаторов.
P2 = 1

# T. Точечные запреты — wrapper'ы вместо отключения инструмента
# (DISM /RestoreHealth, powercfg /hibernate on, fsutil DisableDeleteNotify,
# vssadmin delete shadows, bcdedit recoveryenabled No).
# Windows-only.
T = 1

# P3. Ситуативные. По умолчанию ВЫКЛЮЧЕНЫ: каждая позиция здесь ломает
# рабочую функцию (печать, Hyper-V, сенсорный ввод, связь с телефоном) и
# включается только под конкретный профиль владельца.
P3 = 0

# P5. Enforcement-задача (research/03-patterns.md): запуск от SYSTEM, при
# старте с задержкой ~2 мин и далее раз в 6 часов, идемпотентна, пишет лог
# «что вернулось». Windows-only.
P5 = 1

# --- Обязательные пост-проверки -------------------------------------------

# Сужение канала обновлений вместо полной блокировки: после применения Центр
# обновления обязан оставаться работоспособным для security-патчей. Проверка
# выполняется всегда; ключ управляет только тем, считать ли её провал ошибкой.
VERIFY_WU = 1

# --- Точечные исключения ---------------------------------------------------

# Точка доступа с ноутбука — рабочий инструмент выездного мастера
# (research/06, P2: «вынести в отдельный профиль "полевые работы"»).
# Поэтому эти две службы по умолчанию ИСКЛЮЧЕНЫ из отключения, хотя и входят
# в перечень P2. Снять комментарий — отключать их вместе со всеми.
EXCLUDE_SERVICES = icssvc,SharedAccess

# P3-позиции, включаемые явно под профиль владельца. Перечислять через
# запятую; пустой список — ничего из P3 не применяется, даже при P3 = 1.
# Возможные значения (research/06, P3):
#   TabletInputService   — нет сенсорного ввода
#   lfsvc                — не нужны геозависимые функции (уже в P1b)
#   hyperv               — vmms, vmcompute, HvHost; ВНИМАНИЕ: нужны для
#                          VBS/Credential Guard
#   Spooler              — нет принтеров; печать сломается
#   WMPNetworkSvc        — нет медиа-шаринга (уже в P2)
#   nfc                  — AJRouter, SEMgrSvc, WalletService
#   phone                — PhoneSvc, MessagingService
P3_ENABLE =

# --- Прочее ----------------------------------------------------------------

# Куда писать отчёт о фактически применённом. Отчёт — вход для отката:
# по нему видно, что именно было изменено, без перебора дампа.
# Пусто — отчёт не пишется (тогда остаётся только лог в %TEMP%/tmp).
REPORT_DIR =
